  <style>
    :root {
      --bg: #060d1a;
      --surface: rgba(8,18,38,0.72);
      --glass: rgba(12,26,56,0.55);
      --border: rgba(80,140,255,0.13);
      --border-hover: rgba(80,160,255,0.32);
      --text: #e8f0ff;
      --muted: #6a85b6;
      --accent: #3a8ef6;
      --accent2: #1dffd4;
      --accent-glow: rgba(58,142,246,0.22);
      --radius: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sora', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: env(safe-area-inset-top, 0) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 0) env(safe-area-inset-left, 0);
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80vw 55vh at 10% -5%, rgba(30,90,220,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 60vw 40vh at 90% 10%, rgba(0,200,180,0.10) 0%, transparent 60%),
        radial-gradient(ellipse 100vw 30vh at 50% 100%, rgba(10,30,80,0.5) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(58,142,246,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(58,142,246,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 560px;
      margin: 0 auto;
      padding: 28px 16px 100px;
    }

    header {
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    .logo-mark {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: linear-gradient(135deg, #0d2a6e, #0a4a3a);
      border: 1px solid rgba(58,142,246,0.28);
      box-shadow: 0 0 28px rgba(58,142,246,0.28), 0 0 0 4px rgba(58,142,246,0.07);
      overflow: hidden;
      display: grid;
      place-items: center;
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-fallback {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -1px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.4px;
      background: linear-gradient(90deg, #c8deff, #1dffd4 80%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-sub {
      font-size: 11.5px;
      color: var(--muted);
      font-weight: 300;
      letter-spacing: 0.5px;
      font-family: 'Space Mono', monospace;
      margin-top: -4px;
    }

    .section-label {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--accent);
      font-family: 'Space Mono', monospace;
      margin: 28px 0 12px;
      opacity: 0.8;
    }

    .link-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 9px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
      cursor: default;
    }

    .link-card:active { transform: scale(0.985); }

    @media (hover: hover) {
      .link-card:hover {
        border-color: var(--border-hover);
        box-shadow: 0 0 0 1px rgba(58,142,246,0.08), 0 8px 28px rgba(0,0,0,0.3);
      }
    }

    .card-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
      flex: 1;
    }

    .card-name {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-url {
      font-size: 11px;
      color: var(--muted);
      font-family: 'Space Mono', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      direction: ltr;
      text-align: right;
    }

    .card-actions {
      display: flex;
      gap: 7px;
      flex-shrink: 0;
    }

    .btn-copy, .btn-open {
      appearance: none;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-family: 'Sora', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 13px;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-copy {
      background: rgba(58,142,246,0.13);
      color: #8bbfff;
      border-color: rgba(58,142,246,0.22);
    }

    .btn-copy:active, .btn-copy.copied {
      background: rgba(29,255,212,0.12);
      color: var(--accent2);
      border-color: rgba(29,255,212,0.3);
      transform: scale(0.95);
    }

    .btn-open {
      background: rgba(255,255,255,0.04);
      color: var(--muted);
      border-color: var(--border);
      text-decoration: none;
    }

    .btn-open:active { background: rgba(255,255,255,0.08); transform: scale(0.95); }

    .toast {
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
      left: 50%;
      transform: translateX(-50%) translateY(12px);
      background: rgba(8,20,50,0.92);
      border: 1px solid rgba(29,255,212,0.25);
      border-radius: 999px;
      padding: 11px 18px;
      font-size: 13px;
      color: var(--accent2);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: 0 0 24px rgba(29,255,212,0.12);
      white-space: nowrap;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .toast-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent2);
      box-shadow: 0 0 8px var(--accent2);
    }

    .contact-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--glass);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 9px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .contact-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1a3a6e, #0a4a3a);
      border: 1.5px solid rgba(58,142,246,0.3);
      box-shadow: 0 0 14px rgba(58,142,246,0.2);
      overflow: hidden;
      flex-shrink: 0;
      display: grid;
      place-items: center;
    }

    .contact-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .contact-avatar .avatar-fallback {
      font-size: 17px;
      color: rgba(200,220,255,0.6);
    }

    .contact-info { flex: 1; min-width: 0; }
    .contact-name { font-size: 15px; font-weight: 600; }
    .contact-role { font-size: 11px; color: var(--muted); margin-top: 2px; font-family: 'Space Mono', monospace; }

    .btn-wa {
      appearance: none;
      border: 1px solid rgba(37,211,102,0.25);
      border-radius: var(--radius-sm);
      font-family: 'Sora', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      padding: 9px 13px;
      background: rgba(37,211,102,0.10);
      color: #4ddb7a;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    .btn-wa:active { background: rgba(37,211,102,0.18); transform: scale(0.95); }

    .divider { height: 1px; background: var(--border); margin: 20px 0 4px; }
  </style>
</head>

<body>
  <div class="wrap">

  const root = document.getElementById("root");
  const toast = document.getElementById("toast");

  let toastTimer;

  function showToast(msg) {
    toastMsg.textContent = msg;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  async function copy(url, btn) {
    try {
      await navigator.clipboard.writeText(url);
    } catch {
      const ta = document.createElement("textarea");
      ta.value = url; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy");
      document.body.removeChild(ta);
    }
    btn.classList.add("copied");
    btn.textContent = "✓";
    showToast("הועתק ✓");
    setTimeout(() => { btn.classList.remove("copied"); btn.innerHTML = copyIcon() + " העתק"; }, 1400);
  }

  function copyIcon() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;
  }

  function openIcon() {
    return `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>`;
  }

      root.appendChild(label);

          div.style.margin = "14px 0";
          root.appendChild(div);

        if (item.type === "contact") {

          const avatar = document.createElement("div");

          avatar.innerHTML = `

            <div class="contact-role">${item.role}</div>

          const actions = document.createElement("div");
          actions.className = "card-actions";

          const waBtn = document.createElement("a");
          waBtn.className = "btn-wa";

          waBtn.target = "_blank";
          waBtn.rel = "noopener";
          waBtn.innerHTML = `<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg> WhatsApp`;

          const copyBtn = document.createElement("button");

          actions.appendChild(waBtn);

        left.appendChild(name);

        const actions = document.createElement("div");

        const openBtn = document.createElement("a");
        openBtn.className = "btn-open";
        openBtn.href = item.url;
        openBtn.target = "_blank";
        openBtn.rel = "noopener";
        openBtn.innerHTML = openIcon() + " פתח";

        const copyBtn = document.createElement("button");
        copyBtn.className = "btn-copy";
        copyBtn.type = "button";
        copyBtn.innerHTML = copyIcon() + " העתק";
        copyBtn.addEventListener("click", () => copy(item.url, copyBtn));

        actions.appendChild(openBtn);
        actions.appendChild(copyBtn);
        card.appendChild(left);
        card.appendChild(actions);
        root.appendChild(card);
      });
    });
